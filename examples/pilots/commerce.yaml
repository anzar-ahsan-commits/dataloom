format_version: 1
seed: 42
reference_date: '2025-01-01'
entities:
  customers:
    rows: 12
  orders:
    fanout:
      parent: customers
      foreign_key:
      - customer_id
      minimum: 2
      maximum: 4
    rules:
      status:
        choices:
        - pending
        - paid
        - shipped
      note:
        null_rate: 0.1
  order_lines:
    fanout:
      parent: orders
      foreign_key:
      - order_id
      minimum: 2
      maximum: 4
    rules:
      units:
        minimum: 1
        maximum: 8
      unit_price:
        minimum: 5
        maximum: 120
      line_total:
        derive:
          kind: arithmetic
          operation: multiply
          fields:
          - units
          - unit_price
          decimals: 2
